# Pinned deliberately. Tracking unpinned "stable" meant every Rust release
# added new clippy lints to code nobody had rechecked, which is how ~86 lints
# accumulated between May and September 2026 and silently broke CI on every
# open pull request. Bump this on purpose, in its own PR, so new lints arrive
# as a reviewable change instead of as a surprise failure.
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
