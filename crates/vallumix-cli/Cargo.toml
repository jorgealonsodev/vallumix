[package]
name = "vallumix-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Vallumix CLI — CIS Linux hardening tool"
keywords = ["cis", "linux", "hardening", "compliance", "security"]
categories = ["command-line-utilities"]

[[bin]]
name = "vallumix"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
anyhow = { workspace = true }
owo-colors = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
nix = { workspace = true, features = ["user"] }
vallumix-core = { workspace = true }
vallumix-controls = { workspace = true }
vallumix-reporters = { workspace = true }
vallumix-backup = { workspace = true }
rayon = { workspace = true }
indicatif = { workspace = true }
clap_complete = { workspace = true }
chrono = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }

[build-dependencies]
clap = { workspace = true }
clap_mangen = { workspace = true }
clap_complete = { workspace = true }

[package.metadata.deb]
maintainer = "Vallumix Contributors <vallumix@example.com>"
section = "admin"
priority = "optional"
depends = "libc6"
extended-description = """\
Vallumix audits and hardens Linux servers against CIS benchmarks. It ships \
70+ controls covering SSH, networking, filesystem permissions, services, \
logging and authentication, reports in HTML, JSON, JUnit and plain text, and \
takes a versioned backup before every change so any control can be rolled \
back individually or by session."""
assets = [
    ["target/release/vallumix", "usr/bin/vallumix", "755"],
    ["../../man/vallumix.1", "usr/share/man/man1/vallumix.1", "644"],
    ["../../completions/vallumix.bash", "usr/share/bash-completion/completions/vallumix", "644"],
    ["../../completions/_vallumix", "usr/share/zsh/vendor-completions/_vallumix", "644"],
    ["../../profiles/web.toml", "etc/vallumix/profiles/web.toml", "644"],
    ["../../profiles/database.toml", "etc/vallumix/profiles/database.toml", "644"],
    ["../../profiles/bastion.toml", "etc/vallumix/profiles/bastion.toml", "644"],
]
# Profiles are meant to be edited on the host: dpkg must not overwrite local
# changes on upgrade.
conf-files = [
    "/etc/vallumix/profiles/web.toml",
    "/etc/vallumix/profiles/database.toml",
    "/etc/vallumix/profiles/bastion.toml",
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/vallumix", dest = "/usr/bin/vallumix", mode = "755" },
    { source = "../../man/vallumix.1", dest = "/usr/share/man/man1/vallumix.1", mode = "644" },
    { source = "../../profiles/web.toml", dest = "/etc/vallumix/profiles/web.toml", mode = "644", config = "noreplace" },
    { source = "../../profiles/database.toml", dest = "/etc/vallumix/profiles/database.toml", mode = "644", config = "noreplace" },
    { source = "../../profiles/bastion.toml", dest = "/etc/vallumix/profiles/bastion.toml", mode = "644", config = "noreplace" },
]
auto-req = "no"
license = "MIT OR Apache-2.0"
